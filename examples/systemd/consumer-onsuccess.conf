# Run a consumer (here my-report.service) after every successful fetch, incremental or
# full, and never after a failed or stopped one. Install as:
#   /etc/systemd/system/centric-api-fetch.service.d/my-report.conf
#   /etc/systemd/system/centric-api-full.service.d/my-report.conf
# then `systemctl daemon-reload`. The consumer opens the database read-only
# (centric_api.read.Reader); run it as the same user (User=centric-api in
# my-report.service). Read permission alone isn't enough: SQLite in WAL mode creates
# its -shm/-wal files next to the database even for readers.
[Unit]
OnSuccess=my-report.service
