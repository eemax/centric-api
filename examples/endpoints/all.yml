# centric-api configuration: every bundled endpoint (42).
# The same as leaving `endpoints:` out; listed so you can delete what you don't need.
# Copy to centric-api.yml (or pass --config). Names refer to the bundled endpoint
# definitions; override a key with a mapping, e.g. `- {name: boms, limit: 200}`.
# More in docs/deployment.md.

